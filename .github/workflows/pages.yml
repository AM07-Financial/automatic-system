name: Deploy AM company site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website package
        run: python3 -c "import zipfile; zipfile.ZipFile('am-company-free-static.zip').extractall('site')"
      - name: Apply requested page updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path("site/public/site.css")
          css_text = css.read_text(encoding="utf-8").replace("--cream:#f6f4ee", "--cream:#fff")
          css_text += "\nhtml,body,header,nav,main,section,footer,.top,.nav,.hero,.footer,.card{background:#fff!important;background-image:none!important;color:#153d52!important}.links,.lang,.brand small,.hero p,.footer p,.copy,.muted{color:#334b56!important}.lang,.btn.secondary{border-color:#153d52!important}.copy{border-color:#e3e6e3!important}.site-address{font:11px Arial,sans-serif;color:var(--gold);margin-top:14px;direction:ltr}.site-address a{text-decoration:underline;text-underline-offset:3px}"
          css.write_text(css_text, encoding="utf-8")

          site_js = Path("site/public/site.js")
          js = site_js.read_text(encoding="utf-8")
          needle = '<div class="copy" data-ar="الموقع تعريفي فقط، ولا يشكل مشورة مالية أو عرضًا للاستثمار." data-en="For information only; not financial advice or an offer to invest."></div>'
          website = '<div class="site-address"><a href="https://am07-financial.github.io/automatic-system/" data-ar="الموقع الرسمي: am07-financial.github.io/automatic-system" data-en="Website: am07-financial.github.io/automatic-system">Website: am07-financial.github.io/automatic-system</a></div>'
          if 'class="site-address"' not in js:
              js = js.replace(needle, website + needle)
          site_js.write_text(js, encoding="utf-8")

          contact = Path("site/public/contact.html")
          html = contact.read_text(encoding="utf-8")
          html = html.replace("تواصل هاتفيًا مع شركة AM", "تواصل مع شركة AM")
          html = re.sub(
              r'<section class="card">.*?</section>',
              '<section class="card"><h2 data-ar="مقر الشركة" data-en="Company office"></h2><p data-ar="طرابلس — النوفليين، ليبيا" data-en="Tripoli — Al-Nofliyeen, Libya"></p><p class="muted" data-ar="لا تدخل معلومات مصرفية أو بيانات حساسة عبر الموقع." data-en="Do not share banking or sensitive information through the website."></p></section>',
              html,
              count=1,
          )
          contact.write_text(html, encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - id: deployment
        uses: actions/deploy-pages@v4
