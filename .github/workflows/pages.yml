name: Deploy AM company site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website package
        run: python3 -c "import zipfile; zipfile.ZipFile('am-company-free-static.zip').extractall('site')"
      - name: Apply site branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          d=Path("site/public")
          p=d/"site.css"
          s=p.read_text(encoding="utf-8").replace("--cream:#f6f4ee","--cream:#fff").replace("--navy:#081e2c","--navy:#050505").replace("--blue:#153d52","--blue:#4169e1").replace("--gold:#d7b56d","--gold:#c9a227")
          s += "\nhtml,body,header,nav,main,section,footer,.top,.nav,.hero,.footer,.card{background:#050505!important;background-image:none!important;color:#d4af37!important}.links,.lang,.brand small,.hero p,.footer p,.copy{color:#d4af37!important}.lang,.btn.secondary{border-color:var(--blue)!important}.copy{border-color:#d4af37!important}.site-address{font:11px Arial,sans-serif;color:var(--gold);margin-top:14px;direction:ltr}.site-address a{text-decoration:underline;text-underline-offset:3px}.hero h1,.title,.card h2,.card h3,.brand strong{color:#d4af37!important}.eyebrow,.site-address,.links a[aria-current=page]{color:var(--gold)!important}.btn{background:#050505!important;color:#d4af37!important}.card{border-color:#d4af37!important}.experience-band{background:#050505!important;border-block:1px solid #d4af37;padding:17px 0}.experience-band p{margin:0;border-right:4px solid #d4af37;padding:4px 14px;color:#d4af37;font-weight:600}"
          p.write_text(s,encoding="utf-8")
          q=d/"chat.js"
          q.write_text(r'''(()=>{let existing=document.getElementById("am-chat-open");if(existing){existing.onclick=()=>{let box=document.getElementById("am-chat-box");if(box)box.hidden=!box.hidden};return;}let s=document.createElement("style");s.textContent=".amchat{position:fixed;left:20px;bottom:20px;z-index:99999;font:15px Arial,sans-serif;color:#d4af37}.amchat button,.amchat input{background:#050505!important;color:#d4af37!important;border:1px solid #d4af37;border-radius:10px;padding:10px}.amchat button{cursor:pointer}.amchat-open{border-radius:50%!important;width:58px;height:58px;font-size:24px;position:relative}.amchat-open::after{content:'أنا مساعدك الذكي';position:absolute;bottom:66px;left:50%;transform:translateX(-50%);width:max-content;max-width:190px;padding:6px 10px;border:1px solid #d4af37;border-radius:10px;background:#050505;color:#d4af37;font:12px Arial,sans-serif;direction:rtl}.amchat-box{position:absolute;left:0;bottom:70px;width:min(340px,calc(100vw - 32px));height:420px;background:#050505;border:1px solid #d4af37;border-radius:14px;display:flex;flex-direction:column}.amchat-box[hidden]{display:none}.amchat-head,.amchat-note{padding:12px;border-bottom:1px solid #66551e}.amchat-note{font-size:11px;border:0;border-top:1px solid #66551e}.amchat-log{flex:1;overflow:auto;padding:12px}.amchat-msg{padding:9px;margin:6px 0;border:1px solid #554619;border-radius:10px;line-height:1.5}.amchat-form{display:flex;gap:6px;padding:10px}.amchat-form input{flex:1;min-width:0}@media(max-width:450px){.amchat{left:12px;bottom:14px}.amchat-box{height:65vh}}";document.head.append(s);let r=document.createElement("div");r.className="amchat";r.innerHTML="<button id=am-chat-open class=amchat-open aria-label='افتح مساعد AM'><svg viewBox='0 0 48 48' width='34' height='34' aria-hidden='true'><circle cx='24' cy='24' r='21' fill='#111' stroke='#d4af37' stroke-width='2'/><path d='M12 21a12 12 0 0 1 24 0v5H12z' fill='#d4af37'/><rect x='14' y='19' width='20' height='16' rx='7' fill='#101010' stroke='#d4af37' stroke-width='2'/><circle cx='20' cy='26' r='2' fill='#d4af37'/><circle cx='28' cy='26' r='2' fill='#d4af37'/><path d='M20 31h8M18 36l-3 5h18l-3-5' fill='#d4af37' stroke='#d4af37' stroke-width='2' stroke-linejoin='round'/><path d='M11 12l-3-3m29 3 3-3' stroke='#d4af37' stroke-width='2' stroke-linecap='round'/></svg></button><section class=amchat-box id=am-chat-box role=dialog aria-label='دردشة AM' hidden><header class=amchat-head><b>مساعد AM الذكي</b> <button id=am-chat-close aria-label=إغلاق>×</button></header><div class=amchat-log id=am-chat-log aria-live=polite><div class=amchat-msg>أهلًا بك. اسأل عن خدماتنا أو فروعنا. هذه دردشة تجريبية بإجابات جاهزة وليست متصلة بنموذج ذكاء اصطناعي.</div></div><div class=amchat-note>معلومات عامة فقط، ولا يقدم المساعد توصيات مالية. لا ترسل بيانات شخصية أو مصرفية.</div><form class=amchat-form id=am-chat-form><input id=am-chat-input aria-label='اكتب سؤالك' placeholder='اكتب سؤالك…' autocomplete=off><button>إرسال</button></form></section>";document.body.append(r);let box=document.getElementById("am-chat-box"),inp=document.getElementById("am-chat-input"),log=document.getElementById("am-chat-log");document.getElementById("am-chat-open").onclick=()=>{box.hidden=!box.hidden;if(!box.hidden)inp.focus()};document.getElementById("am-chat-close").onclick=()=>box.hidden=true;function reply(q){if(/تداول|عملات رقمية|crypto|trading/i.test(q))return "تقدم الشركة معلومات عن التداول والأصول الرقمية، وهي مجالات عالية المخاطر. لا يقدم هذا المساعد توصيات أو ينفذ صفقات.";if(/خدمات|قطاعات|services/i.test(q))return "تشمل خدمات AM الخدمات المالية والصرافة، التداول والأصول الرقمية، النفط والغاز، التوريدات، الاستشارات والتمويل، وفق التراخيص المحلية.";if(/فروع|فرع|دبي|تركيا|بنغازي|عمان|بلغاريا|واشنطن|branch/i.test(q))return "مقر الشركة طرابلس، النوفليين. راجع صفحة الفروع للمواقع التي زودتنا بها الإدارة.";if(/تواصل|اتصال|contact/i.test(q))return "تفضل بزيارة صفحة تواصل معنا لمعرفة معلومات المقر وطرق التواصل المتاحة.";return "يمكنني الإجابة عن معلومات عامة حول الخدمات والفروع والتداول. هذه إجابات جاهزة وليست ذكاءً اصطناعيًا مباشرًا."}document.getElementById("am-chat-form").onsubmit=e=>{e.preventDefault();let q=inp.value.trim();if(!q)return;for(let t of [q,reply(q)]){let m=document.createElement("div");m.className="amchat-msg";m.textContent=t;log.append(m)}inp.value="";log.scrollTop=log.scrollHeight}})();''',encoding="utf-8")
          for f in d.glob("*.html"):
              h=f.read_text(encoding="utf-8")
              h=h.replace("</head>",'<style>#am-chat-open{position:relative}#am-chat-open::after{content:"أنا مساعدك الذكي";position:absolute;bottom:66px;left:50%;transform:translateX(-50%);width:max-content;max-width:190px;padding:6px 10px;border:1px solid #d4af37;border-radius:10px;background:#050505;color:#d4af37;font:12px Arial,sans-serif;direction:rtl}</style></head>')
              h=h.replace("</head>","<style>html,body,header,nav,main,section,footer,.site-header,.top,.nav,.hero,.footer,.card{background:#050505!important;background-image:none!important;color:#d4af37!important}.hero h1,.title,.brand strong,.card h2,.card h3,.links a,.lang{color:#d4af37!important}.btn{background:#050505!important;color:#d4af37!important;border-color:#d4af37!important}.card,.copy{border-color:#d4af37!important}</style></head>")
              if "chat.js" not in h:
                  h=h.replace("</body>",'<script src="chat.js?v=robot"></script></body>')
                  f.write_text(h,encoding="utf-8")
          p=d/"site.js"; s=p.read_text(encoding="utf-8")
          if 'class="site-address"' not in s:
              needle='<div class="copy" data-ar="الموقع تعريفي فقط، ولا يشكل مشورة مالية أو عرضًا للاستثمار." data-en="For information only; not financial advice or an offer to invest."></div>'
              link='<div class="site-address"><a href="https://am07-financial.github.io/automatic-system/" data-ar="الموقع الرسمي: am07-financial.github.io/automatic-system" data-en="Website: am07-financial.github.io/automatic-system">Website: am07-financial.github.io/automatic-system</a></div>'
              s=s.replace(needle,link+needle)
          p.write_text(s,encoding="utf-8")
          p=d/"index.html"; s=p.read_text(encoding="utf-8")
          s=s.replace('</section><section class="content">','</section><div class="experience-band"><div class="wrap"><p data-ar="فريقنا يضم مستشارين ماليين بخبرات تزيد عن 25 عامًا." data-en="Our team includes financial consultants with more than 25 years of experience."></p></div></div><section class="content">',1) if "experience-band" not in s else s
          p.write_text(s,encoding="utf-8")
          p=d/"branches.html"; s=p.read_text(encoding="utf-8")
          if "🇱🇾" not in s:
              pairs=[('المقر الرئيسي · ليبيا|Head office · Libya','🇱🇾 المقر الرئيسي · ليبيا|🇱🇾 Head office · Libya'),('data-ar="ليبيا" data-en="Libya"','data-ar="🇱🇾 ليبيا" data-en="🇱🇾 Libya"'),('الإمارات العربية المتحدة|United Arab Emirates','🇦🇪 الإمارات العربية المتحدة|🇦🇪 United Arab Emirates'),('data-ar="تركيا" data-en="Turkey"','data-ar="🇹🇷 تركيا" data-en="🇹🇷 Turkey"'),('فرع دولي|International branch','فرع دولي · 🇹🇷 تركيا|International branch · 🇹🇷 Turkey'),('الولايات المتحدة الأمريكية|United States of America','🇺🇸 الولايات المتحدة الأمريكية|🇺🇸 United States of America'),('سلطنة عُمان|Sultanate of Oman','🇴🇲 سلطنة عُمان|🇴🇲 Sultanate of Oman'),('data-ar="بلغاريا" data-en="Bulgaria"','data-ar="🇧🇬 بلغاريا" data-en="🇧🇬 Bulgaria"')]
              for old,new in pairs:
                  if '|' in old and 'data-ar=' not in old:
                      a,b=old.split('|'); x,y=new.split('|'); s=s.replace(f'data-ar="{a}" data-en="{b}"',f'data-ar="{x}" data-en="{y}"')
                  else:s=s.replace(old,new)
              s=s.replace('<h2 data-ar="🇧🇬 بلغاريا" data-en="🇧🇬 Bulgaria"></h2><p data-ar="فرع دولي · 🇹🇷 تركيا" data-en="International branch · 🇹🇷 Turkey">','<h2 data-ar="🇧🇬 بلغاريا" data-en="🇧🇬 Bulgaria"></h2><p data-ar="فرع دولي · بلغاريا" data-en="International branch · Bulgaria">')
          oman=s.find('🇴🇲'); start=s.rfind('<article class="card">',0,oman); end=s.find('</article>',oman)
          if start>=0 and end>=0:
              card=s[start:end]; card=re.sub(r'data-ar="فرع دولي[^"]*" data-en="International branch[^"]*"','data-ar="فرع دولي · سلطنة عُمان" data-en="International branch · Oman"',card,count=1); s=s[:start]+card+s[end:]
          p.write_text(s,encoding="utf-8")
          p=d/"contact.html"; s=p.read_text(encoding="utf-8")
          s=s.replace("تواصل هاتفيًا مع شركة AM","تواصل مع شركة AM")
          s=re.sub(r'<section class="card">.*?</section>','<section class="card"><h2 data-ar="مقر الشركة" data-en="Company office"></h2><p data-ar="طرابلس — النوفليين، ليبيا" data-en="Tripoli — Al-Nofliyeen, Libya"></p><p class="muted" data-ar="لا تدخل معلومات مصرفية أو بيانات حساسة عبر الموقع." data-en="Do not share banking or sensitive information through the website."></p></section>',s,count=1)
          p.write_text(s,encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - id: deployment
        uses: actions/deploy-pages@v4
